<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180">
  <rect width="240" height="180" fill="#ffffff"/>
  <!-- PwC geometric stepped blocks (top right) -->
  <!-- Column 1 (leftmost main column of blocks) -->
  <rect x="150" y="6" width="44" height="14" fill="#EB8C00"/>
  <rect x="150" y="20" width="44" height="18" fill="#E36800"/>
  <rect x="150" y="38" width="44" height="28" fill="#D84A00"/>
  <rect x="150" y="66" width="28" height="14" fill="#C22B00"/>
  <rect x="178" y="66" width="16" height="14" fill="#D84A00"/>
  <rect x="150" y="80" width="28" height="22" fill="#A61900"/>
  <rect x="178" y="80" width="16" height="22" fill="#BF2600"/>
  <!-- Small horizontal red bar at bottom-left of grid vertex -->
  <rect x="106" y="102" width="44" height="11" fill="#A61900"/>
  <!-- Column 2 (middle strip) -->
  <rect x="194" y="20" width="9" height="18" fill="#F5B665"/>
  <rect x="194" y="38" width="9" height="42" fill="#E88D14"/>
  <rect x="194" y="80" width="9" height="22" fill="#D03A00"/>
  <!-- Column 3 (gold/orange column) -->
  <rect x="203" y="38" width="22" height="42" fill="#F3BE26"/>
  <rect x="203" y="80" width="22" height="22" fill="#DF5311"/>
  <!-- Column 4 (far right pink block) -->
  <rect x="225" y="80" width="11" height="22" fill="#E669A2"/>
  <!-- "pwc" serif wordmark (bottom left) -->
  <text
    x="8"
    y="156"
    font-family="Georgia, 'Times New Roman', Times, serif"
    font-weight="bold"
    font-size="82"
    letter-spacing="-2"
    fill="#000000"
  >pwc</text>
</svg>
